<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" font-family="Helvetica, Arial, sans-serif">
  <style>
    .sym { fill: none; stroke: white; stroke-width: 3; }
    .aff { fill: white; stroke: white; stroke-width: 3; }
    .line { stroke: white; stroke-width: 2.5; fill: none; }
    .lbl { fill: white; font-size: 22px; text-anchor: middle; }
    .sub { fill: white; font-size: 18px; text-anchor: middle; opacity: 0.85; }
    .legend-text { fill: white; font-size: 18px; text-anchor: start; }
  </style>

  <rect x="0" y="0" width="1500" height="700" fill="black" />

  <!-- Generation I: the parents (first cousins) -->
  <rect class="sym" x="680" y="20" width="40" height="40" />
  <circle class="sym" cx="800" cy="40" r="20" />
  <line class="line" x1="720" y1="37" x2="780" y2="37" />
  <line class="line" x1="720" y1="43" x2="780" y2="43" />
  <text class="lbl" x="700" y="80">I-1</text>
  <text class="lbl" x="800" y="80">I-2</text>

  <!-- drop from marriage midpoint to sibship bar -->
  <line class="line" x1="750" y1="43" x2="750" y2="140" />
  <line class="line" x1="70" y1="140" x2="1400" y2="140" />

  <!-- drops from sibship bar to each of the 8 children -->
  <line class="line" x1="70" y1="140" x2="70" y2="180" />
  <line class="line" x1="260" y1="140" x2="260" y2="180" />
  <line class="line" x1="450" y1="140" x2="450" y2="180" />
  <line class="line" x1="640" y1="140" x2="640" y2="180" />
  <line class="line" x1="830" y1="140" x2="830" y2="180" />
  <line class="line" x1="1020" y1="140" x2="1020" y2="180" />
  <line class="line" x1="1210" y1="140" x2="1210" y2="180" />
  <line class="line" x1="1400" y1="140" x2="1400" y2="180" />

  <!-- Generation II: 8 children, birth order 1-8, all symbols the same size -->

  <!-- child 1: sex unknown, died in infancy, unaffected -->
  <polygon class="sym" points="70,180 90,200 70,220 50,200" />
  <line class="line" x1="48" y1="178" x2="92" y2="222" />
  <text class="lbl" x="70" y="250">1</text>

  <!-- child 2 -->
  <polygon class="sym" points="260,180 280,200 260,220 240,200" />
  <line class="line" x1="238" y1="178" x2="282" y2="222" />
  <text class="lbl" x="260" y="250">2</text>

  <!-- child 3 -->
  <polygon class="sym" points="450,180 470,200 450,220 430,200" />
  <line class="line" x1="428" y1="178" x2="472" y2="222" />
  <text class="lbl" x="450" y="250">3</text>

  <!-- child 4: unaffected, sex/details not given -->
  <polygon class="sym" points="640,180 660,200 640,220 620,200" />
  <text class="lbl" x="640" y="250">4</text>

  <!-- child 5: female, unaffected, married (unrelated), 3 unaffected children -->
  <circle class="sym" cx="830" cy="200" r="20" />
  <text class="lbl" x="830" y="250">5</text>
  <rect class="sym" x="910" y="180" width="40" height="40" />
  <line class="line" x1="850" y1="200" x2="910" y2="200" />
  <line class="line" x1="880" y1="200" x2="880" y2="320" />
  <line class="line" x1="810" y1="320" x2="950" y2="320" />
  <line class="line" x1="810" y1="320" x2="810" y2="360" />
  <line class="line" x1="880" y1="320" x2="880" y2="360" />
  <line class="line" x1="950" y1="320" x2="950" y2="360" />
  <polygon class="sym" points="810,360 830,380 810,400 790,380" />
  <polygon class="sym" points="880,360 900,380 880,400 860,380" />
  <polygon class="sym" points="950,360 970,380 950,400 930,380" />

  <!-- child 6: unaffected -->
  <polygon class="sym" points="1020,180 1040,200 1020,220 1000,200" />
  <text class="lbl" x="1020" y="250">6</text>

  <!-- child 7: the patient, male, affected (alkaptonuric), married (unrelated), 3 unaffected children -->
  <rect class="aff" x="1190" y="180" width="40" height="40" />
  <text class="lbl" x="1210" y="250">7</text>
  <circle class="sym" cx="1310" cy="200" r="20" />
  <line class="line" x1="1230" y1="200" x2="1290" y2="200" />
  <line class="line" x1="1260" y1="200" x2="1260" y2="320" />
  <line class="line" x1="1190" y1="320" x2="1330" y2="320" />
  <line class="line" x1="1190" y1="320" x2="1190" y2="360" />
  <line class="line" x1="1260" y1="320" x2="1260" y2="360" />
  <line class="line" x1="1330" y1="320" x2="1330" y2="360" />
  <polygon class="sym" points="1190,360 1210,380 1190,400 1170,380" />
  <polygon class="sym" points="1260,360 1280,380 1260,400 1240,380" />
  <polygon class="sym" points="1330,360 1350,380 1330,400 1310,380" />

  <!-- child 8: unaffected -->
  <polygon class="sym" points="1400,180 1420,200 1400,220 1380,200" />
  <text class="lbl" x="1400" y="250">8</text>

  <!-- legend: two rows, three columns, generous spacing so nothing overlaps -->
  <g>
    <!-- row 1 -->
    <rect class="sym" x="60" y="530" width="40" height="40" />
    <text class="legend-text" x="115" y="556">unaffected</text>

    <rect class="aff" x="560" y="530" width="40" height="40" />
    <text class="legend-text" x="615" y="556">affected (alkaptonuric)</text>

    <polygon class="sym" points="1080,530 1100,550 1080,570 1060,550" />
    <text class="legend-text" x="1115" y="556">sex not recorded</text>

    <!-- row 2 -->
    <rect class="sym" x="60" y="610" width="40" height="40" />
    <line class="line" x1="58" y1="608" x2="102" y2="652" />
    <text class="legend-text" x="115" y="636">died in infancy</text>

    <line class="line" x1="560" y1="627" x2="600" y2="627" />
    <line class="line" x1="560" y1="633" x2="600" y2="633" />
    <text class="legend-text" x="615" y="636">first-cousin (consanguineous) marriage</text>
  </g>

  <text class="sub" x="750" y="690" font-style="italic">
    Reconstructed from H. Ogden's case, family data in Garrod (1902), "The Incidence of Alkaptonuria"
  </text>
</svg>
